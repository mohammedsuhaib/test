<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nur Academy — Islamic Classes LMS (prototype)</title>
  <meta name="description" content="Clickable prototype: Islamic class LMS with course management, class scheduler and Zoom meeting links.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">☪</span>
        <div><strong>Nur Academy</strong><small>Islamic Classes LMS</small></div>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="demo-note">Prototype · data is stored in this browser only. Zoom links are simulated.</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="bismillah" lang="ar" dir="rtl">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
        <div class="topbar-right">
          <span class="hijri" id="hijri"></span>
          <button class="btn ghost sm" id="langBtn" type="button" lang="ur" aria-label="Language">اردو</button>
          <label class="who">Viewing as
            <select id="who"></select>
          </label>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="modal"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="lang-ur.js"></script>
  <script src="app.js"></script>
</body>
</html>
